name: CI

on:
  pull_request: # all branches
  push:
    branches: [master, 'sp/*']
    tags: ['v*'] # docker-push job is additionally gated on this via its `if` condition

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Key covers Directory.Packages.props AND every *.csproj so any project file change busts the cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Blanket -warnaserror gates compile warnings + high/critical vulnerabilities (NU1903/NU1904 are
      # already errors via WarningsAsErrors in Directory.Build.props); NU1901/NU1902 (low/moderate audit
      # findings) are suppressed here so they only *report* as warnings, not fail this job. The dedicated
      # `audit` job below is the vulnerability gate.
      - name: Build (warnings as errors)
        run: dotnet build NewsQuack.sln -c Release -warnaserror /p:NoWarn=NU1901%3BNU1902

      # --no-build reuses the Release build above; coverlet.msbuild still emits coverage.cobertura.xml and
      # enforces the per-project Threshold (verified locally).
      - name: Test (coverage gates enforced)
        run: dotnet test -c Release --no-build

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            tests/NewsQuack.Core.Tests/coverage.cobertura.xml
            tests/NewsQuack.App.Tests/coverage.cobertura.xml

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Vulnerability gate: NuGetAudit runs during restore; NU1903/NU1904 (high/critical) are errors via
      # WarningsAsErrors in Directory.Build.props, NU1901/NU1902 (low/moderate) stay warnings. No blanket
      # -warnaserror here, so low/moderate findings do not fail the job.
      - name: Audit NuGet packages (fail on high/critical)
        run: dotnet restore NewsQuack.sln

  docker-push:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # only on tag v* pushes
    permissions:
      packages: write # GITHUB_TOKEN pushes release images to GHCR; no repo secrets needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch image, GHCR only, tagged with the tag name itself (no `latest` in the v1.0 phase).
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ toLower(github.repository_owner) }}/newsquack:${{ github.ref_name }}
